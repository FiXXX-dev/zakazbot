<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ZakazBot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="login.html">Zakaz<span>Bot</span></a>
    </div>
  </header>

  <main class="container" style="max-width:460px">
    <h1 id="auth-title">Вход</h1>
    <div id="setup-warning"></div>

    <section class="card">
      <div class="tabs" id="auth-tabs">
        <button type="button" data-mode="signin" class="active">Войти</button>
        <button type="button" data-mode="signup">Регистрация</button>
      </div>

      <div class="field" id="company-field" style="display:none">
        <label for="auth-company">Название компании</label>
        <input type="text" id="auth-company" placeholder="Например: ОптТорг">
      </div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@company.uz" autocomplete="username">
      </div>
      <div class="field">
        <label for="auth-password">Пароль</label>
        <input type="password" id="auth-password" placeholder="не менее 6 символов" autocomplete="current-password">
      </div>

      <div style="margin-top:14px">
        <button type="button" id="auth-submit" class="btn">Войти</button>
      </div>
      <div id="auth-msg"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
